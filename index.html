<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AniStack — Anime Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  :root {
    --bg: #0b0d18;
    --bg2: #12152a;
    --bg3: #1a1f38;
    --surface: #1e2340;
    --border: rgba(255,255,255,0.07);
    --text: #e8eaf6;
    --text-muted: #8891b8;
    --accent: #e879a0;
    --accent2: #7c8eff;
    --accent3: #4fd1c5;
    --font-size: 15px;
    --card-radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.45);
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: var(--font-size); scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100dvh;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  input, textarea, select, button { font-family: inherit; font-size: inherit; }
  button { cursor: pointer; border: none; background: none; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 99px; }
  .app-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 16px 80px;
  }
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11,13,24,0.88);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    margin: 0 -16px;
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
    flex-shrink: 0;
    text-shadow: 0 0 24px rgba(232,121,160,0.4);
    white-space: nowrap;
  }
  .logo span { color: var(--accent2); }
  .search-wrap {
    flex: 1;
    min-width: 160px;
    position: relative;
  }
  .search-wrap i {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.85rem;
    pointer-events: none;
  }
  #searchInput {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px 9px 34px;
    color: var(--text);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  #searchInput:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(124,142,255,0.18);
  }
  #searchInput::placeholder { color: var(--text-muted); }
  .header-btns {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .hbtn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 500;
    transition: background var(--transition), transform var(--transition);
  }
  .hbtn:active { transform: scale(0.96); }
  .hbtn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 12px rgba(232,121,160,0.35);
  }
  .hbtn-primary:hover { background: #d96490; }
  .hbtn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .hbtn-secondary:hover { background: var(--bg3); }
  .hbtn i { font-size: 0.8rem; }
  .stats-bar {
    display: flex;
    gap: 8px;
    padding: 16px 0 8px;
    flex-wrap: wrap;
  }
  .stat-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 5px 12px;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .stat-chip .num {
    color: var(--text);
    font-weight: 600;
  }
  .stat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0 14px;
    flex-wrap: wrap;
  }
  .filter-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }
  .pill {
    padding: 5px 14px;
    border-radius: 99px;
    font-size: 0.78rem;
    font-weight: 500;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    transition: all var(--transition);
  }
  .pill.active, .pill:hover {
    background: var(--accent2);
    color: #fff;
    border-color: var(--accent2);
  }
  .font-control {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .font-control i { font-size: 0.7rem; }
  #fontSlider {
    width: 80px;
    accent-color: var(--accent2);
    cursor: pointer;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    padding-top: 4px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
  .card {
    border-radius: var(--card-radius);
    padding: 16px;
    cursor: pointer;
    position: relative;
    transition: transform var(--transition), box-shadow var(--transition);
    animation: cardIn 0.35s cubic-bezier(0.4,0,0.2,1) both;
    overflow: hidden;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .card:active { transform: translateY(-2px) scale(0.99); }
  .card[data-theme="default"] { background: var(--surface); border: 1px solid var(--border); }
  .card[data-theme="sakura"]  { background: linear-gradient(135deg,#2d1a26,#3d2033); border: 1px solid rgba(232,121,160,0.2); }
  .card[data-theme="ocean"]   { background: linear-gradient(135deg,#0e1f3a,#133052); border: 1px solid rgba(79,179,255,0.2); }
  .card[data-theme="forest"]  { background: linear-gradient(135deg,#0e2718,#133320); border: 1px solid rgba(79,209,148,0.2); }
  .card[data-theme="sunset"]  { background: linear-gradient(135deg,#2d1900,#3d2800); border: 1px solid rgba(255,160,79,0.2); }
  .card[data-theme="void"]    { background: linear-gradient(135deg,#0d0d1a,#16132a); border: 1px solid rgba(180,100,255,0.2); }
  .card[data-theme="steel"]   { background: linear-gradient(135deg,#161c28,#1c2436); border: 1px solid rgba(100,180,255,0.15); }
  .card-badge {
    position: absolute;
    top: 10px; right: 10px;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 99px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .badge-watching  { background: rgba(124,142,255,0.2); color: #7c8eff; }
  .badge-completed { background: rgba(79,209,148,0.2); color: #4fd194; }
  .badge-paused    { background: rgba(255,200,79,0.2);  color: #ffc84f; }
  .badge-dropped   { background: rgba(255,100,100,0.2); color: #ff7070; }
  .badge-planned   { background: rgba(160,160,180,0.2); color: #a0a0b8; }
  .card-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.35;
    padding-right: 52px;
    word-break: break-word;
  }
  .card-meta {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: auto;
  }
  .card-ep {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .card-ep i { font-size: 0.7rem; color: var(--accent3); }
  .ep-bar-wrap {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .ep-bar {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }
  .card-rating {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 0.75rem;
  }
  .stars { display: flex; gap: 2px; }
  .star {
    font-size: 0.6rem;
    color: rgba(255,255,255,0.15);
    transition: color 0.1s;
  }
  .star.lit { color: #ffc84f; }
  .rating-num {
    color: var(--text-muted);
    font-size: 0.72rem;
    margin-left: 4px;
  }
  .card-notes {
    font-size: 0.75rem;
    color: var(--text-muted);
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-del {
    position: absolute;
    bottom: 10px; right: 10px;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: rgba(255,80,80,0.12);
    color: rgba(255,100,100,0.6);
    font-size: 0.7rem;
    opacity: 0;
    transition: opacity var(--transition), background var(--transition);
  }
  .card:hover .card-del { opacity: 1; }
  .card-del:hover { background: rgba(255,80,80,0.28); color: #ff7070; }
  .empty-state {
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    gap: 12px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-icon {
    font-size: 3rem;
    opacity: 0.3;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .empty-state h3 { color: var(--text); font-size: 1.1rem; font-weight: 600; }
  .empty-state p { font-size: 0.85rem; max-width: 260px; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(6px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 520px;
    max-height: 92dvh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    animation: slideUp 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  @keyframes slideUp { from{transform:translateY(24px);opacity:0} to{transform:translateY(0);opacity:1} }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 0;
    margin-bottom: 16px;
  }
  .modal-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }
  .modal-close {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .modal-close:hover { background: rgba(255,80,80,0.18); color: #ff7070; }
  .modal-body { padding: 0 20px 20px; }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 14px;
  }
  .form-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .form-input {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    width: 100%;
  }
  .form-input:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(124,142,255,0.18);
  }
  .form-input::placeholder { color: var(--text-muted); }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  textarea.form-input { resize: vertical; min-height: 70px; }
  select.form-input { cursor: pointer; }
  select.form-input option { background: var(--bg2); }
  .star-picker { display: flex; gap: 6px; padding: 4px 0; }
  .star-pick {
    font-size: 1.3rem;
    color: rgba(255,255,255,0.15);
    cursor: pointer;
    transition: color 0.1s, transform 0.1s;
  }
  .star-pick:hover, .star-pick.active { color: #ffc84f; transform: scale(1.15); }
  .theme-picker { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
  .theme-swatch {
    width: 34px; height: 34px;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color var(--transition), transform var(--transition);
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .theme-swatch.selected { border-color: white; }
  .theme-swatch:hover { transform: scale(1.1); }
  .theme-swatch i { font-size: 0.7rem; color: rgba(255,255,255,0.7); display: none; }
  .theme-swatch.selected i { display: block; }
  .sw-default { background: var(--surface); }
  .sw-sakura  { background: linear-gradient(135deg,#2d1a26,#3d2033); }
  .sw-ocean   { background: linear-gradient(135deg,#0e1f3a,#133052); }
  .sw-forest  { background: linear-gradient(135deg,#0e2718,#133320); }
  .sw-sunset  { background: linear-gradient(135deg,#2d1900,#3d2800); }
  .sw-void    { background: linear-gradient(135deg,#0d0d1a,#16132a); }
  .sw-steel   { background: linear-gradient(135deg,#161c28,#1c2436); }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 18px;
  }
  .btn {
    padding: 9px 20px;
    border-radius: 10px;
    font-size: 0.83rem;
    font-weight: 600;
    transition: all var(--transition);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 12px rgba(232,121,160,0.3); }
  .btn-primary:hover { background: #d96490; }
  .btn-ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--bg3); }
  .btn-danger { background: rgba(255,80,80,0.15); color: #ff7070; border: 1px solid rgba(255,80,80,0.2); }
  .btn-danger:hover { background: rgba(255,80,80,0.28); }
  .btn-success { background: rgba(79,209,148,0.15); color: #4fd194; border: 1px solid rgba(79,209,148,0.2); }
  .btn-success:hover { background: rgba(79,209,148,0.28); }
  .import-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .itab {
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 500;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    transition: all var(--transition);
  }
  .itab.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  .import-panel { display: none; }
  .import-panel.active { display: block; }
  .import-hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--bg3);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    line-height: 1.5;
  }
  .import-hint code {
    background: rgba(124,142,255,0.15);
    color: var(--accent2);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: monospace;
  }
  .export-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-family: monospace;
    font-size: 0.72rem;
    color: var(--text-muted);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
    margin-bottom: 10px;
    line-height: 1.4;
  }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 0.82rem;
    color: var(--text);
    box-shadow: var(--shadow);
    z-index: 999;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.3s;
    opacity: 0;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast i { font-size: 0.85rem; }
  .fab {
    display: none;
    position: fixed;
    bottom: 24px; right: 20px;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 1.3rem;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(232,121,160,0.5);
    z-index: 90;
    transition: transform var(--transition), box-shadow var(--transition);
  }
  .fab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(232,121,160,0.6); }
  @media (max-width: 600px) { .fab { display: flex; } }
  .sort-select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    color: var(--text-muted);
    font-size: 0.76rem;
    cursor: pointer;
    outline: none;
  }
  @media (max-width: 480px) {
    .logo { font-size: 1.15rem; }
    .hbtn span { display: none; }
    .font-control span { display: none; }
    #fontSlider { width: 60px; }
    .header-inner { gap: 8px; }
  }
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="logo">Ani<span>Stack</span></div>
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search anime…" autocomplete="off" />
    </div>
    <div class="header-btns">
      <button class="hbtn hbtn-secondary" onclick="openImportExport()">
        <i class="fa-solid fa-arrows-rotate"></i><span>Import/Export</span>
      </button>
      <button class="hbtn hbtn-primary" onclick="openAddModal()">
        <i class="fa-solid fa-plus"></i><span>Add Anime</span>
      </button>
    </div>
  </div>
</header>
<div class="app-wrap">
  <div class="stats-bar" id="statsBar"></div>
  <div class="toolbar">
    <div class="filter-pills" id="filterPills">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill" data-filter="watching">Watching</button>
      <button class="pill" data-filter="completed">Completed</button>
      <button class="pill" data-filter="paused">Paused</button>
      <button class="pill" data-filter="dropped">Dropped</button>
      <button class="pill" data-filter="planned">Planned</button>
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="recent">Recent</option>
      <option value="title">Title A-Z</option>
      <option value="rating">Highest Rating</option>
      <option value="progress">Progress</option>
    </select>
    <div class="font-control">
      <i class="fa-solid fa-font"></i>
      <input type="range" id="fontSlider" min="12" max="20" value="15" step="1" />
      <span>Aa</span>
    </div>
  </div>
  <div class="grid" id="cardGrid"></div>
</div>
<button class="fab" onclick="openAddModal()"><i class="fa-solid fa-plus"></i></button>
<div id="toast"></div>
<div class="modal-overlay" id="editModalOverlay" style="display:none" onclick="handleOverlayClick(event,'editModalOverlay')">
  <div class="modal" id="editModal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="editModalTitle">Add Anime</div>
      <button class="modal-close" onclick="closeModal('editModalOverlay')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Anime Title *</label>
        <input type="text" class="form-input" id="f_title" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select class="form-input" id="f_status">
            <option value="watching">Watching</option>
            <option value="completed">Completed</option>
            <option value="paused">Paused</option>
            <option value="dropped">Dropped</option>
            <option value="planned">Planned</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Genre</label>
          <input type="text" class="form-input" id="f_genre" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Episodes Watched</label>
          <input type="number" class="form-input" id="f_epCurrent" />
        </div>
        <div class="form-group">
          <label class="form-label">Total Episodes</label>
          <input type="number" class="form-input" id="f_epTotal" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Rating</label>
        <div class="star-picker" id="starPicker"></div>
        <input type="hidden" id="f_rating" value="0" />
      </div>
      <div class="form-group">
        <label class="form-label">Theme</label>
        <div class="theme-picker" id="themePicker"></div>
        <input type="hidden" id="f_theme" value="default" />
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <textarea class="form-input" id="f_notes"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="deleteBtn" style="display:none;margin-right:auto" onclick="deleteEntry()">Delete</button>
        <button class="btn btn-ghost" onclick="closeModal('editModalOverlay')">Cancel</button>
        <button class="btn btn-primary" onclick="saveEntry()">Save</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="ieModalOverlay" style="display:none" onclick="handleOverlayClick(event,'ieModalOverlay')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title">Import / Export</div>
      <button class="modal-close" onclick="closeModal('ieModalOverlay')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="import-tabs">
        <button class="itab active" onclick="switchIETab('paste',this)">Paste</button>
        <button class="itab" onclick="switchIETab('json',this)">JSON</button>
        <button class="itab" onclick="switchIETab('export',this)">Export</button>
      </div>
      <div class="import-panel active" id="panel_paste">
        <textarea class="form-input" id="ie_paste" rows="8"></textarea>
        <div class="modal-actions">
          <button class="btn btn-primary" onclick="importPaste()">Import</button>
        </div>
      </div>
      <div class="import-panel" id="panel_json">
        <textarea class="form-input" id="ie_json" rows="8"></textarea>
        <div class="modal-actions">
          <button class="btn btn-primary" onclick="importJSON()">Import JSON</button>
        </div>
      </div>
      <div class="import-panel" id="panel_export">
        <div class="export-box" id="exportBox"></div>
        <div class="modal-actions">
          <button class="btn btn-success" onclick="copyExport()">Copy</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
let db = { entries: [] };
let editingId = null;
let currentFilter = 'all';
let currentSearch = '';
function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function saveData() { localStorage.setItem('anistack_v2', JSON.stringify(db)); }
function loadData() {
  const raw = localStorage.getItem('anistack_v2');
  if (raw) db = JSON.parse(raw);
}
const THEMES = ['default','sakura','ocean','forest','sunset','void','steel'];
const STATUS_COLORS = { watching: 'badge-watching', completed: 'badge-completed', paused: 'badge-paused', dropped: 'badge-dropped', planned: 'badge-planned' };
function getFilteredSorted() {
  let list = [...db.entries];
  if (currentFilter !== 'all') list = list.filter(e => e.status === currentFilter);
  if (currentSearch.trim()) {
    const q = currentSearch.toLowerCase();
    list = list.filter(e => (e.title||'').toLowerCase().includes(q) || (e.genre||'').toLowerCase().includes(q));
  }
  const sort = document.getElementById('sortSelect').value;
  if (sort === 'title') list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  else if (sort === 'rating') list.sort((a,b) => (b.rating||0) - (a.rating||0));
  else list.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  return list;
}
function renderCards() {
  const grid = document.getElementById('cardGrid');
  const list = getFilteredSorted();
  grid.innerHTML = '';
  list.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-theme', entry.theme || 'default');
    card.onclick = () => openEditModal(entry.id);
    const pct = entry.epTotal ? Math.min(100, Math.round((entry.epCurrent||0) / entry.epTotal * 100)) : 0;
    card.innerHTML = `
      <span class="card-badge ${STATUS_COLORS[entry.status]}">${entry.status}</span>
      <div class="card-title">${entry.title}</div>
      <div class="card-meta">
        <div class="ep-bar-wrap"><div class="ep-bar" style="width:${pct}%"></div></div>
        <div class="rating-num">${entry.rating}/10</div>
      </div>`;
    grid.appendChild(card);
  });
  renderStats();
}
function renderStats() {
  const bar = document.getElementById('statsBar');
  bar.innerHTML = `<div class="stat-chip">Total <span class="num">${db.entries.length}</span></div>`;
}
function openAddModal() { editingId = null; clearForm(); openModal('editModalOverlay'); }
function openEditModal(id) {
  const entry = db.entries.find(e=>e.id===id);
  editingId = id;
  fillForm(entry);
  document.getElementById('deleteBtn').style.display = 'block';
  openModal('editModalOverlay');
}
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function handleOverlayClick(e, id) { if (e.target.id === id) closeModal(id); }
function buildStarPicker() {
  const container = document.getElementById('starPicker');
  for (let i=1; i<=10; i++) {
    const btn = document.createElement('span');
    btn.className = 'star-pick';
    btn.textContent = '★';
    btn.onclick = () => setRating(i);
    container.appendChild(btn);
  }
}
function setRating(val) {
  document.getElementById('f_rating').value = val;
  document.querySelectorAll('.star-pick').forEach((s,i) => s.classList.toggle('active', i < val));
}
function buildThemePicker() {
  const container = document.getElementById('themePicker');
  THEMES.forEach(t => {
    const sw = document.createElement('div');
    sw.className = `theme-swatch sw-${t}`;
    sw.onclick = () => setTheme(t);
    container.appendChild(sw);
  });
}
function setTheme(val) {
  document.getElementById('f_theme').value = val;
  document.querySelectorAll('.theme-swatch').forEach(s => s.classList.toggle('selected', s.className.includes(val)));
}
function clearForm() {
  ['f_title','f_epCurrent','f_epTotal','f_genre','f_notes'].forEach(id => document.getElementById(id).value = '');
  setRating(0);
}
function fillForm(entry) {
  document.getElementById('f_title').value = entry.title;
  document.getElementById('f_status').value = entry.status;
  document.getElementById('f_epCurrent').value = entry.epCurrent;
  document.getElementById('f_epTotal').value = entry.epTotal;
  setRating(entry.rating);
  setTheme(entry.theme);
}
function saveEntry() {
  const entry = {
    title: document.getElementById('f_title').value,
    status: document.getElementById('f_status').value,
    epCurrent: parseInt(document.getElementById('f_epCurrent').value) || 0,
    epTotal: parseInt(document.getElementById('f_epTotal').value) || 0,
    rating: parseInt(document.getElementById('f_rating').value) || 0,
    theme: document.getElementById('f_theme').value,
    notes: document.getElementById('f_notes').value
  };
  if (editingId) {
    const idx = db.entries.findIndex(e=>e.id===editingId);
    db.entries[idx] = { ...db.entries[idx], ...entry };
  } else {
    entry.id = generateId();
    entry.createdAt = Date.now();
    db.entries.unshift(entry);
  }
  saveData();
  closeModal('editModalOverlay');
  renderCards();
}
function deleteEntry() {
  db.entries = db.entries.filter(e=>e.id!==editingId);
  saveData();
  closeModal('editModalOverlay');
  renderCards();
}
function switchIETab(panel, el) {
  document.querySelectorAll('.itab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.import-panel').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(`panel_${panel}`).classList.add('active');
}
function importPaste() {
  const raw = document.getElementById('ie_paste').value.trim();
  raw.split('\n').forEach(line => {
    db.entries.push({ id: generateId(), title: line, status: 'watching', createdAt: Date.now() });
  });
  saveData();
  renderCards();
  closeModal('ieModalOverlay');
}
function copyExport() { navigator.clipboard.writeText(JSON.stringify(db.entries)); }
document.getElementById('searchInput').addEventListener('input', e => { currentSearch = e.target.value; renderCards(); });
document.getElementById('filterPills').addEventListener('click', e => {
  if (e.target.classList.contains('pill')) {
    currentFilter = e.target.dataset.filter;
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    e.target.classList.add('active');
    renderCards();
  }
});
document.getElementById('fontSlider').addEventListener('input', e => { document.documentElement.style.setProperty('--font-size', e.target.value + 'px'); });
loadData();
buildStarPicker();
buildThemePicker();
renderCards();
</script>
</body>
</html>
